name: CI Booking

on:
  push:
    branches: [ cibooking ]

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: booking

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installer les dépendances
        run: npm install

      - name: Build projet
        run: npm run build